name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Ruff (código Python)
        run: |
          pip install ruff
          (cd services/catalog && ruff check .)
          (cd services/appointments && ruff check .)

      - name: Hadolint (Dockerfile del catálogo)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/catalog/Dockerfile

      - name: Hadolint (Dockerfile de citas)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/appointments/Dockerfile

  test:
    name: Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [catalog, appointments]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: citas
          POSTGRES_PASSWORD: citas
          POSTGRES_DB: citas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citas -d citas_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://citas:citas@localhost:5432/citas_test
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar tests unitarios y de integración
        run: pytest -v

  publish:
    name: Imagen (${{ matrix.service }})
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [catalog, appointments]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/chaimaemoussaoui8/nail-booking-${{ matrix.service }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}